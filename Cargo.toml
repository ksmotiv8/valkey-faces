[package]
name = "valkey-faces"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rustface = { version = "0.1", default-features = false }
tract-onnx = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
redis = "=1.4.1"

[profile.release]
opt-level = 3
lto = true
strip = true
